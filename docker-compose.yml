services:
  label-printer-web:
    build: ./label_printer
    image: label-printer-web:latest
    container_name: label-printer-web
    restart: unless-stopped
    ports:
      - "5001:5001"
    # USB-Drucker (Brother QL-500) via libusb (pyusb) über /dev/bus/usb.
    # Dieses Verzeichnis ist stabil und spiegelt Hotplug dynamisch, daher ist
    # nach dem Umstecken des Druckers kein Container-/LXC-Neustart nötig.
    privileged: true
    volumes:
      # Persistente Daten: labels.json, printer.json, templates/
      - ./label_printer/data:/data
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - BROTHER_MODEL=QL-500
      - BROTHER_BACKEND=pyusb
      # Optional: Druck an eine andere Instanz am Drucker abgeben
      # - LABEL_WEB_PRINT_PROXY=http://10.0.0.225:5001
